# CI: Format (Auto-Fix auf main, Check bei PRs), Lint (Selene → Annotations), Economy-Simulation.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
      - name: Format auto-fix (main)
        if: github.event_name != 'pull_request'
        run: |
          stylua src tests
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "style: stylua autoformat"
            git push
          fi
      - name: Format check (PR)
        if: github.event_name == 'pull_request'
        run: stylua --check src tests
      - name: Lint
        run: |
          selene --display-style json2 src tests > selene.json || true
          python3 tools/scripts/selene_annotate.py selene.json
  economy-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Economy-Simulation + Zielkurven-Check
        run: python3 tools/economy-sim/sim.py --check
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Relay-Tests (Logging → Discord)
        working-directory: relay
        run: npm test
      - name: Discord-Setup-Tests (simulierter Discord)
        run: node --test tools/discord-setup/setup.test.mjs
      - name: Dashboard-Datei aktuell (dist/worker.js aus src/ gebaut)
        working-directory: relay
        run: |
          node build.mjs
          git diff --exit-code dist/
