# CI-Grundgerüst – aktiv, sobald das Repo auf GitHub liegt.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
      - name: Format prüfen
        run: stylua --check src tests
      - name: Linten
        run: selene src tests
  economy-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Economy-Simulation + Zielkurven-Check
        run: python3 tools/economy-sim/sim.py --check
